<section class="ui-card chart-card" [attr.aria-label]="title() | t">
  <header class="head">
    <h2 class="title">{{ title() | t }}</h2>
    @if (note()) {
      <span class="ui-muted note">{{ note() | t }}</span>
    }
    @if (positiveLabel()) {
      <ul class="legend">
        <li><span class="swatch"></span>{{ positiveLabel() | t }}</li>
        @if (negativeLabel()) {
          <li><span class="swatch negative"></span>{{ negativeLabel() | t }}</li>
        }
      </ul>
    }
  </header>
  @if (hasData()) {
    <svg [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" [attr.aria-label]="title() | t">
      @for (tick of ticks(); track $index) {
        <line
          class="grid"
          [attr.x1]="left"
          [attr.x2]="right"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
        />
        <text class="axis" [attr.x]="left - 6" [attr.y]="tick.y + 3" text-anchor="end">
          {{ tick.label | t }}
        </text>
      }
      @for (bar of bars(); track $index) {
        <rect
          class="bar"
          [class.negative]="bar.isNegative"
          [class.dimmed]="
            (selectedIndex() !== undefined && selectedIndex() !== $index) ||
            (hovered() !== undefined && hovered() !== $index && selectedIndex() === undefined)
          "
          [class.hovered]="hovered() === $index"
          rx="2"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="barWidth()"
          [attr.height]="bar.height"
        >
          <title>{{ bar.description }}</title>
        </rect>
        @if ($index % labelEvery() === 0) {
          <text
            class="axis"
            [attr.x]="bar.x + barWidth() / 2"
            [attr.y]="height - 6"
            text-anchor="middle"
          >
            {{ bar.label | t }}
          </text>
        }
        @if (selectable()) {
          <rect
            class="hit"
            role="button"
            tabindex="0"
            [attr.x]="bar.slotX"
            y="0"
            [attr.width]="slot()"
            [attr.height]="height"
            [attr.aria-pressed]="selectedIndex() === $index"
            [attr.aria-label]="bar.description"
            (mouseenter)="hovered.set($index)"
            (mouseleave)="hovered.set(undefined)"
            (focus)="hovered.set($index)"
            (blur)="hovered.set(undefined)"
            (click)="pick.emit($index)"
            (keydown.enter)="pick.emit($index)"
            (keydown.space)="pick.emit($index); $event.preventDefault()"
          />
        } @else {
          <rect
            class="zone"
            aria-hidden="true"
            [attr.x]="bar.slotX"
            y="0"
            [attr.width]="slot()"
            [attr.height]="height"
            (mouseenter)="hovered.set($index)"
            (mouseleave)="hovered.set(undefined)"
          />
        }
      }
      @if (tooltip(); as box) {
        <g class="tooltip" aria-hidden="true">
          <rect
            class="tooltip-box"
            rx="4"
            [attr.x]="box.x"
            [attr.y]="box.y"
            [attr.width]="box.width"
            [attr.height]="box.height"
          />
          @for (line of box.lines; track $index) {
            <text
              class="tooltip-text"
              [class.strong]="$index > 0"
              [attr.x]="line.x"
              [attr.y]="line.y"
            >
              {{ line.text }}
            </text>
          }
        </g>
      }
    </svg>
  } @else {
    <p class="empty ui-muted">{{ emptyText() | t }}</p>
  }
  <ng-content />
</section>
